.wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px}

.chip{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.list{display:grid;gap:10px}

.item b{display:block;font-weight:600}

.empty{text-align:center;color:var(--muted);padding:32px 0}
body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -10%,color-mix(in srgb,#16a34a 14%,transparent),transparent),radial-gradient(700px 360px at -10% 0%,color-mix(in srgb,#d97706 10%,transparent),transparent);background-repeat:no-repeat}
.wrap{max-width:920px;padding:20px 16px 56px}

.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:220px;height:220px;right:-60px;top:-80px}
.hero::after{width:140px;height:140px;right:70px;bottom:-70px}
.hero>*{position:relative;z-index:1}
.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:rgba(255,255,255,.2);margin-bottom:12px}
.hero h1{color:#fff;font-size:1.7rem;margin:0 0 6px}
.hero p.sub{color:rgba(255,255,255,.88);margin:0 0 16px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.2);padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:600}
.search{position:relative}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.search input{padding:15px 16px 15px 46px;border-radius:14px;box-shadow:0 4px 14px rgba(16,24,40,.06)}
.chips{margin:14px 0 4px}
.chip{padding:7px 14px;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip .n{display:inline-block;margin-left:6px;min-width:22px;padding:0 6px;border-radius:999px;font-size:.78rem;background:color-mix(in srgb,var(--muted) 20%,transparent);text-align:center}
.chip.on .n{background:rgba(255,255,255,.28);color:inherit}
.list{display:block}
.group h2{display:flex;align-items:center;gap:10px;font-size:1.08rem;margin:26px 0 12px}
.group h2 small{color:var(--muted);font-weight:400;font-size:.82rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-top:4px solid var(--c);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(16,24,40,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 28px rgba(16,24,40,.12)}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 16%,transparent)}
.card b{font-weight:600;line-height:1.35}
.card .go{margin-top:auto;color:var(--c);font-weight:600;font-size:.88rem}
.card.off{opacity:.55}.card.off:hover{transform:none;box-shadow:none}
.empty{padding:40px 0}
@media (max-width:480px){.grid{grid-template-columns:1fr}.hero h1{font-size:1.45rem}}
</style>

];
/* ============================= */
const q=document.getElementById('q'),list=document.getElementById('list'),chips=document.getElementById('chips');
let dept="ทั้งหมด";
const depts=["ทั้งหมด",...new Set(JDS.map(j=>j.dept).filter(Boolean))];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderChips(){
  chips.innerHTML=depts.map(d=>`<button class="chip${d===dept?' on':''}" data-d="${esc(d)}">${esc(d)}</button>`).join('');
}
function render(){
  const t=q.value.trim().toLowerCase();
  const r=JDS.filter(j=>(dept==="ทั้งหมด"||j.dept===dept)&&(j.title+" "+(j.dept||"")).toLowerCase().includes(t));
  list.innerHTML=r.length?r.map(j=>`<div class="item"><div><b>${esc(j.title)}</b><small>${esc(j.dept||"")}</small></div>${j.url?`<a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">เปิด JD</a>`:'<span class="btn" style="opacity:.4">เร็วๆ นี้</span>'}</div>`).join(''):'<div class="empty">ไม่พบตำแหน่งที่ค้นหา</div>';
}
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;dept=b.dataset.d;renderChips();render()});
const META={"Palm Oil Mill":{th:"แผนกผลิตน้ำมันปาล์ม",c:"#d97706",i:"🏭"},"CPO Production":{th:"แผนกปฏิบัติการผลิตน้ำมันปาล์มดิบ",c:"#16a34a",i:"🌴"},"Biogas":{th:"แผนกก๊าซชีวภาพ",c:"#0891b2",i:"♻️"}};
function renderChips(){
  chips.innerHTML=depts.map(d=>{const n=d==="ทั้งหมด"?JDS.length:JDS.filter(j=>j.dept===d).length;return `<button class="chip${d===dept?' on':''}" data-d="${esc(d)}">${esc(d)}<span class="n">${n}</span></button>`}).join('');
}
function render(){
  const t=q.value.trim().toLowerCase();
  const r=JDS.filter(j=>(dept==="ทั้งหมด"||j.dept===dept)&&(j.title+" "+j.dept+" "+((META[j.dept]||{}).th||"")).toLowerCase().includes(t));
  if(!r.length){list.innerHTML='<div class="empty">ไม่พบตำแหน่งที่ค้นหา</div>';return}
  list.innerHTML=[...new Set(r.map(j=>j.dept))].map(g=>{
    const m=META[g]||{th:g,c:"#2563eb",i:"📄"},items=r.filter(j=>j.dept===g);
    const cards=items.map(j=>{
      const inner=`<div class="ic">${m.i}</div><b>${esc(j.title)}</b><span class="go">${j.url?'เปิด JD →':'เร็วๆ นี้'}</span>`;
      return j.url?`<a class="card" href="${esc(j.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="card off">${inner}</div>`;
    }).join('');
    return `<section class="group" style="--c:${m.c}"><h2><span class="dot"></span>${esc(m.th)} <small>${esc(g)} · ${items.length} ตำแหน่ง</small></h2><div class="grid">${cards}</div></section>`;
  }).join('');
}
q.addEventListener('input',render);
renderChips();render();
</script>
